<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#fcf6f9">
  <title>Mes horaires · 8 heures au quotidien</title>
  <link rel="stylesheet" href="style.css?v=scaled-1">
  <script src="script.js?v=day-storage-1" defer></script>
  <script src="layout.js?v=1" defer></script>
</head>
<body>
  <div class="widget-viewport">
  <main class="widget" aria-label="Mes horaires">
    <div class="section-heading"><h1 id="timeline-title" class="widget-title">Votre journée, en un regard</h1></div>
    <form id="schedule" novalidate>
      <div class="field"><label for="start">Début de journée</label><input id="start" name="start" type="time" value="00:00" required step="60"></div>
      <div class="field"><label for="lunch-start">Début de pause</label><input id="lunch-start" name="lunchStart" type="time" value="00:00" required step="60"></div>
      <div class="field"><label for="lunch-end">Fin de pause</label><input id="lunch-end" name="lunchEnd" type="time" value="00:00" required step="60"></div>
      <div class="field finish"><label for="finish">Fin de journée <span>calculée</span></label><output id="finish" for="start lunch-start lunch-end" aria-live="polite">08:00</output></div>
    </form>
    <p id="error" class="error" role="alert" hidden></p>

    <section id="result" aria-labelledby="timeline-title">
      <div class="timeline-scroll" tabindex="0" role="region" aria-label="Frise horaire. Faites défiler horizontalement pour voir toute la journée.">
        <div id="timeline" class="timeline" role="img" aria-label=""></div>
      </div>
      <div class="timeline-footer">
        <ul class="legend" aria-label="Légende"><li><i class="work"></i>Travail</li><li><i class="pause"></i>Pause déjeuner</li><li><i class="outside"></i>Hors travail</li></ul>
        <span class="scroll-hint">Faites défiler la frise ↔</span>
      </div>
    </section>
    <p id="storage-status" class="error" role="status" hidden></p>
  </main>
  </div>
</body>
</html>
